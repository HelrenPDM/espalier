# The configuration of clamd for docs/guides/examples/compose.clamav.yaml
# (clamd.conf(5) of the ClamAV release of the image). It replaces the
# default file of the image; the /init script of the image starts clamd
# with --foreground and freshclam next to it, which updates the signatures
# once a day.

# The only listener: the Unix socket in the volume clamd-socket, which app
# mounts as well (MEDIA_CLAMAV_SOCKET=/run/clamav/clamd.sock). Mode 666 lets
# the user nobody of app connect; only containers that mount the volume
# reach the socket. There is no TCPSocket.
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 666

# clamd starts as root and then runs as the user clamav of the image.
User clamav
LogTime yes

# The limits cover the largest upload, MEDIA_VIDEO_MAX_MB (1024 by default,
# at most 2047 with a scanner): clamd closes the connection of a stream
# above StreamMaxLength, and AlertExceedsMax turns every other exceeded
# limit into a Heuristics.Limits.Exceeded finding, so a file that clamd did
# not scan completely fails with scan_failed. MaxScanTime (milliseconds) is
# three times the longest scan of a file of 1024 MiB that the media spike of
# task 0018 measured on an Intel Core i7-10700K (73 seconds), rounded up. A
# larger MEDIA_VIDEO_MAX_MB or a slower host needs larger values.
StreamMaxLength 1100M
MaxFileSize 1100M
MaxScanSize 1100M
MaxScanTime 220000
AlertExceedsMax yes
